# Active config. Edit this, never hardcode in src/.
# Resolved copy is frozen to outputs/{run_id}/config.json -- that is what stages read.

run_id: v4-mixed-r16
base_model: vinai/PhoWhisper-large    # -small only for local CPU smoke runs; the real run is -large
seed: 42

data:
  # dot2 batch ingested 2026-08-02 via scripts/ingest_paid_dataset_v2.py: dot2's 37
  # rendered train meetings (paid_meeting_0001-0037, 0001-0015 byte-identical to the
  # old paid-dataset) + the old paid-dataset's 6 test meetings repurposed as train
  # (renamed paid_meeting_legacy_0001-0006 -- user decision, since the new model
  # generation uses dot2's corrected test set instead, see below). Old paid-dataset/
  # kept on disk untouched as historical reference, no longer read by this config.
  #
  # dataset_path itself now points past that: dataset/mixed-noisy-v1 merges this
  # paid-dataset-v2 corpus with dataset/youtube-meetings (real, noisy YouTube audio)
  # via scripts/build_mixed_dataset.py -- see youtube-data-pilot/README.md step 6.
  dataset_path: dataset/mixed-noisy-v1
  # Written by `python scripts/fetch_vivos.py --out dataset/vivos` (HuggingFace,
  # AILAB-VNUHCM/vivos). Must exist before `--stage train`: tier 2 is the only
  # measurement of forgetting in the gate, and select_lambda has no lambda to
  # select without an ood_cer column -- src/config.py:validate refuses a null.
  ood_eval_path: dataset/vivos
  # Ingested 2026-07-31 via scripts/ingest_real_bench.py from D:/phowhisper-finetune-exp/
  # dataset/done/ (264 segments after re-segmenting the 20 that exceeded 30s). Tier 4a
  # is in scope for this deadline -- not optional.
  real_bench_path: dataset/real-meetings-bench
  real_clip_path: null                # optional; null = skip
  # split=demo is 4520 segments (4270 train + 250 val carved out below); test is 426
  # segments from dot2's paid_meeting_test_0001-0003, using 10 voices with ZERO overlap
  # with the 10 fixed train voices -- unlike the old test set, this is a genuine
  # unseen-voice measurement. Verified 2026-08-02 (src/data.py resolve_splits).
  # rCd8DSMk3-c added for mixed-noisy-v1: val must contain at least one YouTube
  # meeting, or select_lambda() picks lambda* blind to the real-audio slice just
  # added (youtube-data-pilot/README.md step 6).
  val_meetings: [paid_meeting_0001, paid_meeting_0002, paid_meeting_0011, rCd8DSMk3-c]

# Scoring normalization -- applied identically to hypothesis AND reference.
# PROJECT_CORE.md §6 Stage 4. Never applied to training targets.
normalization:
  strip_punctuation: true
  lowercase: true
  number_convention: word_to_digit    # symmetric; audited via conversions counter
  audit_conversions: true
  filler_tokens: [ừm, ờm, ehm, uhm, hmm]   # ạ/à/ừ/ơ/dạ/vâng are lexical -- never here

eval:
  split: test
  limit: null                          # was 20 (smoke-test leftover); full split now that
                                        # test is 426 segments across 3 voice-disjoint meetings
  batch_size: 8                       # weights load fp16 for eval: 3.1 GiB, room to raise
  num_beams: 1
  language: vi

lora:
  rank: 16                            # 1.76% trainable on large (28.8M / 1.64B), measured
  alpha: 32
  target_modules: [q_proj, k_proj, v_proj, out_proj, fc1, fc2]
  dropout: 0.05
  use_rslora: true                    # scaling = alpha/sqrt(rank)
  min_retained_energy: 0.99           # Path B (full_finetune) SVD guard only

training:
  learning_rate: 2.0e-4
  epochs: 3
  batch_size: 8                       # T4 peak 9.75 GiB measured; 4 -> 8.05, 2 -> 7.21
  grad_accum_steps: 2
  warmup_ratio: 0.1
  full_finetune: false
  gradient_checkpointing: true
  limit: null                         # cap train/val(+ood) segments for a quick dry run of
                                       # `--stage train` (e.g. 20) before the full run; null = full split

sweep:
  lambdas: [0.0, 0.25, 0.5, 0.75, 1.0]
  ood_cer_budget: 0.02                # hard budget; no lambda within it => fail, no fallback
  elbow_ratio_threshold: 10.0         # cost/benefit stop rule (SESSIONS.md E2), see src/config.py

# Eval gate thresholds -- only tiers 1, 2, 4a are in scope for the first run.
# Tier 3 (RTF) dropped, tier 4b (long-form) deferred (deadline scope cut).
gates:
  min_improvement_pct: 10.0           # tier 1: CER_test <= 0.9 * CER_base
  real_cer_regression_pp: 0.0         # tier 4a: CER_real must not regress vs base

hub:
  push: false
  repo_id: null
  private: true
